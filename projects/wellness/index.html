<main id="view" class="view"></main>

<button id="resume" class="resume-pill" data-act="resume" hidden><span class="pulse" aria-hidden="true"></span>Workout in progress <b>Resume</b></button>

<nav class="tabbar" aria-label="Sections">
  <a href="#today" data-tab="today"><svg class="i" aria-hidden="true"><use href="#i-layout-dashboard"/></svg>Today</a>
  <a href="#food" data-tab="food"><svg class="i" aria-hidden="true"><use href="#i-tools-kitchen-2"/></svg>Food</a>
  <a href="#train" data-tab="train"><svg class="i" aria-hidden="true"><use href="#i-barbell"/></svg>Train</a>
  <a href="#history" data-tab="history"><svg class="i" aria-hidden="true"><use href="#i-history"/></svg>History</a>
  <a href="#weight" data-tab="weight"><svg class="i" aria-hidden="true"><use href="#i-chart-line"/></svg>Weight</a>
  <a href="#more" data-tab="more"><svg class="i" aria-hidden="true"><use href="#i-adjustments-horizontal"/></svg>Plan</a>
</nav>

<section id="session" class="session" hidden aria-label="Active workout"></section>

<div id="rest" class="rest" hidden>
  <div class="rest-bar"><i id="rest-bar"></i></div>
  <div class="rest-row">
    <div><span id="rest-label">Rest</span><b id="rest-time">1:30</b></div>
    <div class="rest-btns"><button data-act="rest" data-d="-15">−15</button><button data-act="rest" data-d="15">+15</button><button data-act="rest" data-d="skip">Skip</button></div>
  </div>
</div>

<dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
  <form data-form="food" class="sheet-body" autocomplete="off">
    <div class="sheet-head"><h2 id="sheet-title">Add food</h2><button type="button" class="icon-btn" data-act="closesheet" aria-label="Close"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
    <div id="chips" class="chips"></div>
    <label class="field"><span>Food</span><input name="name" placeholder="e.g. Greek yogurt" required></label>
    <div class="grid2">
      <label class="field"><span>Meal</span><select name="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option></select></label>
      <label class="field"><span>Servings</span><input name="servings" type="number" step="0.25" min="0.25" value="1" inputmode="decimal"></label>
    </div>
    <div class="grid4">
      <label class="field"><span>Calories</span><input name="kcal" type="number" step="any" min="0" inputmode="decimal" placeholder="auto"></label>
      <label class="field pro"><span>Protein g</span><input name="p" type="number" step="any" min="0" inputmode="decimal" placeholder="0"></label>
      <label class="field fat"><span>Fat g</span><input name="f" type="number" step="any" min="0" inputmode="decimal" placeholder="0"></label>
      <label class="field carb"><span>Carbs g</span><input name="c" type="number" step="any" min="0" inputmode="decimal" placeholder="0"></label>
    </div>
    <p class="hint">Leave calories blank to calculate them from the macros. Values are per serving.</p>
    <label class="check"><input type="checkbox" name="save" checked> Save to My Foods for one-tap logging</label>
    <button class="btn block" type="submit">Log food</button>
  </form>
</dialog>

<dialog id="demo" class="sheet" aria-labelledby="demo-title"><div id="demo-body" class="sheet-body"></div></dialog>

<dialog id="ask" class="ask" aria-labelledby="ask-msg"><form method="dialog"><p id="ask-msg"></p><div class="ask-btns"><button class="btn ghost" value="cancel">Cancel</button><button class="btn" id="ask-ok" value="ok">OK</button></div></form></dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js?v=19"></script>
</body>
</html>
